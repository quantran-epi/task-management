services:
  neo4j:
    image: neo4j:5.26-community
    container_name: taskmate-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/localneo4jpassword}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_config_strict__validation_enabled=false
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  knowledge-server:
    build:
      context: ./knowledge-server
      dockerfile: Dockerfile
    container_name: taskmate-knowledge-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      neo4j:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=0.0.0.0
      - PORT=3001
      - HTTPS_TERMINATED=true
      - KNOWLEDGE_SERVER_BODY_LIMIT_BYTES=${KNOWLEDGE_SERVER_BODY_LIMIT_BYTES:-10485760}
      - KNOWLEDGE_SERVER_TOKEN=${KNOWLEDGE_SERVER_TOKEN:-local-dev-knowledge-token}
      - KNOWLEDGE_ALLOWED_ORIGINS=${KNOWLEDGE_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:1420,http://tauri.localhost,https://tauri.localhost,http://127.0.0.1:5173}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_ENABLED=true
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-localneo4jpassword}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      - EMBEDDING_REMOTE_ENABLED=false
      - EMBEDDING_CACHE_DIR=/var/lib/knowledge-server/transformers_cache
      - SNAPSHOT_STORAGE_DIR=/var/lib/knowledge-server/snapshots
      - PLANNER_REMOTE_ENABLED=${PLANNER_REMOTE_ENABLED:-false}
      - PLANNER_ENDPOINT=${PLANNER_ENDPOINT:-}
      - PLANNER_MODEL=${PLANNER_MODEL:-}
      - PLANNER_API_KEY=${PLANNER_API_KEY:-}
      - PLANNER_REMOTE_ALLOWED_HOSTS=${PLANNER_REMOTE_ALLOWED_HOSTS:-}
      - PLANNER_TIMEOUT_MS=${PLANNER_TIMEOUT_MS:-30000}
      - PROSE_EXTRACTION_ENABLED=${PROSE_EXTRACTION_ENABLED:-true}
      - PROSE_EXTRACTION_ENDPOINT=${PROSE_EXTRACTION_ENDPOINT:-}
      - PROSE_EXTRACTION_MODEL=${PROSE_EXTRACTION_MODEL:-}
      - PROSE_EXTRACTION_API_KEY=${PROSE_EXTRACTION_API_KEY:-}
      - PROSE_EXTRACTION_ALLOWED_HOSTS=${PROSE_EXTRACTION_ALLOWED_HOSTS:-}
    volumes:
      - knowledge-server-data:/var/lib/knowledge-server
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://127.0.0.1:3001/api/v1/health/liveness\").then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  neo4j-data:
  knowledge-server-data:
