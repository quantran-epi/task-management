<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="TaskMate - Private offline-first personal task and workload planner" />
    <link rel="icon" type="image/svg+xml" href="/task-management/favicon.svg" />
    <link rel="apple-touch-icon" href="/task-management/pwa-192x192.png" />
    <title>TaskMate</title>
    <style>
      html {
        scrollbar-gutter: stable;
      }
      body {
        margin: 0;
        padding: 0;
        background: #1e1f22;
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justifyContent: center;
        background: #18191c;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        z-index: 9999;
      }
      .loader-spinner {
        width: 38px;
        height: 38px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="loader-spinner"></div>
        <div style="font-size: 13px; font-weight: 500; color: #94a3b8; letter-spacing: 0.04em;">TaskMate Loading...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
