<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>

  <!-- Subtle Top Inner Highlight -->
  <rect width="512" height="256" rx="120" fill="url(#glowGrad)"/>

  <!-- Planner Card with Shadow -->
  <g filter="url(#cardShadow)">
    <!-- Card Backing Plate -->
    <rect x="100" y="116" width="312" height="312" rx="36" fill="#ffffff" fill-opacity="0.16"/>
    <!-- Main Card Body -->
    <rect x="108" y="124" width="296" height="296" rx="32" fill="#ffffff"/>
  </g>

  <!-- Planner Header Bar -->
  <rect x="108" y="124" width="296" height="68" rx="32" fill="#eef2ff"/>
  <rect x="108" y="160" width="296" height="32" fill="#eef2ff"/>

  <!-- Clip Rings / Calendar Pegs -->
  <rect x="180" y="96" width="24" height="44" rx="12" fill="#4338ca"/>
  <rect x="308" y="96" width="24" height="44" rx="12" fill="#4338ca"/>

  <!-- Decorative Planner Lines -->
  <rect x="148" y="224" width="72" height="12" rx="6" fill="#cbd5e1"/>
  <rect x="148" y="254" width="48" height="12" rx="6" fill="#e2e8f0"/>

  <!-- Modern Dynamic Checkmark -->
  <path d="M 224 300 L 272 348 L 368 236" fill="none" stroke="url(#checkGrad)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
