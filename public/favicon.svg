  <path d="M 272 184 C 272 168 284 156 300 156 L 336 156 C 352 156 364 168 364 184 L 364 336 C 364 352 352 364 336 364 L 300 364 C 284 364 272 352 272 336 Z" fill="url(#tmGemRight)" />
