apiVersion: v1
kind: ConfigMap
metadata:
  name: knowledge-server-config
data:
  HOST: "0.0.0.0"
  PORT: "3001"
  HTTPS_TERMINATED: "true"
  KNOWLEDGE_ALLOWED_ORIGINS: "https://taskmate.internal.shb.vn,http://tauri.localhost,https://tauri.localhost,http://localhost:5173,http://localhost:1420"
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_ENABLED: "true"
  NEO4J_DATABASE: "neo4j"
  PLANNER_REMOTE_ENABLED: "true"
  PLANNER_ENDPOINT: "http://10.4.97.70:30129"
  PLANNER_MODEL: "ag/gemini-3.8-flash"
  PLANNER_REMOTE_ALLOWED_HOSTS: "10.4.97.70"
  EMBEDDING_REMOTE_ENABLED: "false"
  EMBEDDING_REMOTE_MODEL: "Xenova/multilingual-e5-small"
  EMBEDDING_REMOTE_DIMENSIONS: "384"
  PROSE_EXTRACTION_ENABLED: "false"
  SNAPSHOT_STORAGE_DIR: "/var/lib/knowledge-server/snapshots"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: knowledge-server-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: knowledge-server
  template:
    metadata:
      labels:
        app: knowledge-server
    spec:
      containers:
        - name: knowledge-server
          image: quantrantestdev/knowledge-server:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: knowledge-server-config
          env:
            - name: KNOWLEDGE_SERVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: knowledge-server-secrets
                  key: KNOWLEDGE_SERVER_TOKEN
            - name: NEO4J_USER
              valueFrom:
                secretKeyRef:
                  name: neo4j-credentials
                  key: NEO4J_USER
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: neo4j-credentials
                  key: NEO4J_PASSWORD
            - name: PLANNER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: knowledge-server-secrets
                  key: PLANNER_API_KEY
          livenessProbe:
            httpGet:
              path: /api/v1/health/liveness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health/readiness
              port: http
              httpHeaders:
                - name: Authorization
                  value: "Bearer $(KNOWLEDGE_SERVER_TOKEN)"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: knowledge-server-data
              mountPath: /var/lib/knowledge-server
      volumes:
        - name: knowledge-server-data
          persistentVolumeClaim:
            claimName: knowledge-server-data
---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-server
spec:
  type: NodePort
  selector:
    app: knowledge-server
  ports:
    - name: http
      port: 3001
      targetPort: http
      nodePort: 30080
