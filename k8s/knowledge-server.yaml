apiVersion: v1
kind: ConfigMap
metadata:
  name: knowledge-server-config
data:
  HOST: "0.0.0.0"
  PORT: "3001"
  HTTPS_TERMINATED: "true"
  KNOWLEDGE_ALLOWED_ORIGINS: "https://taskmate.internal.shb.vn,tauri://localhost,http://tauri.localhost,https://tauri.localhost,http://localhost:5173,http://localhost:1420"
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_ENABLED: "true"
  PLANNER_REMOTE_ENABLED: "true"
  PLANNER_ENDPOINT: "https://9router.internal.shb.vn"
  PLANNER_MODEL: "qwen2.5-72b-instruct"
  PLANNER_REMOTE_ALLOWED_HOSTS: "9router.internal.shb.vn"
---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-server
spec:
  type: NodePort
  ports:
    - port: 3001
      targetPort: 3001
      nodePort: 30080
  selector:
    app: knowledge-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: knowledge-server
  template:
    metadata:
      labels:
        app: knowledge-server
    spec:
      containers:
        - name: knowledge-server
          image: quantrantestdev/knowledge-server:0.1.0
          envFrom:
            - configMapRef:
                name: knowledge-server-config
          env:
            - name: KNOWLEDGE_SERVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: knowledge-server-secrets
                  key: KNOWLEDGE_SERVER_TOKEN
            - name: NEO4J_USER
              valueFrom:
                secretKeyRef:
                  name: neo4j-credentials
                  key: NEO4J_USER
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: neo4j-credentials
                  key: NEO4J_PASSWORD
            - name: PLANNER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: knowledge-server-secrets
                  key: PLANNER_API_KEY
          readinessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10