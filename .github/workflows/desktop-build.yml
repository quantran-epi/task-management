name: Build Desktop Apps

on:
  workflow_dispatch:
    inputs:
      publish_to_taskmate:
        description: 'Publish release to public taskmate repo'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - phase-16-desktop-build
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'universal-apple-darwin'
            rust_targets: 'aarch64-apple-darwin, x86_64-apple-darwin'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            rust_targets: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install TaskMate dependencies
        run: npm ci

      - name: Install Knowledge Server dependencies
        working-directory: knowledge-server
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Build Tauri Desktop Application
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && !inputs.publish_to_taskmate }}
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target ${{ matrix.target }}

      - name: Build and Publish Tauri Desktop Application
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish_to_taskmate }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          owner: 'quantran-epi'
          repo: 'taskmate'
          releaseCommitish: 'main'
          tagName: v__VERSION__
          releaseName: 'TaskMate v__VERSION__'
          releaseBody: 'TaskMate Desktop release for macOS and Windows.'
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Upload macOS Bundles
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
          if-no-files-found: warn

      - name: Upload Windows Installers
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: warn
