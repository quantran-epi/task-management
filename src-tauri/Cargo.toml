[package]
name = "personal-task-workload-planner"
version = "0.1.0"
description = "Personal Task & Workload Planner"
authors = ["Duc Quan Tran"]
edition = "2021"

[lib]
name = "personal_task_workload_planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
